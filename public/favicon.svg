<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Rounded Card -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Highlight -->
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Security Shield Outer Shell -->
  <path d="M 64 20 C 78 20, 96 26, 96 26 C 96 58, 82 82, 64 96 C 46 82, 32 58, 32 26 C 32 26, 50 20, 64 20 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)"/>

  <!-- Security Shield Inner Border -->
  <path d="M 64 24 C 76 24, 91 29, 91 29 C 91 56, 79 77, 64 89 C 49 77, 37 56, 37 29 C 37 29, 52 24, 64 24 Z" 
        fill="#1e293b"/>

  <!-- 3D Package Inside Shield -->
  <g transform="translate(0, -2)">
    <!-- Top Face of Package -->
    <polygon points="64,36 82,46 64,56 46,46" fill="url(#boxTop)"/>
    
    <!-- Top Face Tape Lines -->
    <polygon points="64,36 68,38.2 59,43.2 55,41" fill="#bfdbfe" fill-opacity="0.8"/>
    <polygon points="64,56 68,53.8 59,48.8 55,51" fill="#bfdbfe" fill-opacity="0.8"/>

    <!-- Left Face of Package -->
    <polygon points="46,46 64,56 64,74 46,64" fill="url(#boxLeft)"/>
    <polygon points="53,50 57,52.2 57,70.2 53,68" fill="#1d4ed8" fill-opacity="0.6"/>

    <!-- Right Face of Package -->
    <polygon points="64,56 82,46 82,64 64,74" fill="url(#boxRight)"/>
    <polygon points="71,52 75,49.8 75,67.8 71,70" fill="#1e40af" fill-opacity="0.6"/>
  </g>

  <!-- Green Verified Security Badge -->
  <circle cx="64" cy="80" r="15" fill="url(#badgeGrad)" filter="url(#badgeShadow)"/>
  <circle cx="64" cy="80" r="14" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Crisp Checkmark -->
  <path d="M 58 80 L 62.5 84.5 L 70.5 75.5" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
